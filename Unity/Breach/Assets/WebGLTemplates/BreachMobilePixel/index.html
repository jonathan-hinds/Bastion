<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #070707;
        color: #e8e8e8;
        font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
        touch-action: none;
        overscroll-behavior: none;
      }

      #unity-container {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #070707;
      }

      #unity-canvas {
        width: min(100vw, calc(100vh * 9 / 16));
        height: min(100vh, calc(100vw * 16 / 9));
        background: #0a0a0a;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        outline: none;
      }

      #unity-loading {
        position: fixed;
        left: max(18px, env(safe-area-inset-left));
        right: max(18px, env(safe-area-inset-right));
        bottom: max(18px, env(safe-area-inset-bottom));
        display: grid;
        gap: 10px;
        pointer-events: none;
      }

      #unity-title {
        font-size: 14px;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      #unity-progress-frame {
        height: 8px;
        background: #181818;
        border: 1px solid #606060;
      }

      #unity-progress-bar {
        width: 0%;
        height: 100%;
        background: #f0f0f0;
      }

      #unity-warning {
        position: fixed;
        top: max(12px, env(safe-area-inset-top));
        left: 50%;
        max-width: min(520px, calc(100vw - 32px));
        padding: 8px 10px;
        transform: translateX(-50%);
        background: #181818;
        border: 1px solid #606060;
        color: #f0f0f0;
        font-size: 12px;
        line-height: 1.35;
        display: none;
      }

      #rotate-hint {
        position: fixed;
        inset: 0;
        display: none;
        place-items: center;
        padding: 24px;
        background: rgba(7, 7, 7, 0.92);
        text-align: center;
        font-size: 14px;
        line-height: 1.5;
      }

      @media (orientation: landscape) and (max-height: 900px) {
        #rotate-hint {
          display: grid;
        }
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" width="{{{ WIDTH }}}" height="{{{ HEIGHT }}}" tabindex="-1"></canvas>
    </div>
    <div id="unity-loading">
      <div id="unity-title">{{{ PRODUCT_NAME }}}</div>
      <div id="unity-progress-frame"><div id="unity-progress-bar"></div></div>
    </div>
    <div id="unity-warning"></div>
    <div id="rotate-hint">Rotate your device upright for the intended play view.</div>
    <script>
      const canvas = document.querySelector("#unity-canvas");
      const loading = document.querySelector("#unity-loading");
      const progressBar = document.querySelector("#unity-progress-bar");
      const warning = document.querySelector("#unity-warning");
      const buildUrl = "Build";
      const loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
      const config = {
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "{{{ COMPANY_NAME }}}",
        productName: "{{{ PRODUCT_NAME }}}",
        productVersion: "{{{ PRODUCT_VERSION }}}",
        devicePixelRatio: 1
      };

      function unityShowBanner(message, type) {
        warning.textContent = message;
        warning.style.display = "block";
        warning.style.borderColor = type === "error" ? "#f0f0f0" : "#606060";
        if (type !== "error") {
          setTimeout(() => {
            warning.style.display = "none";
          }, 5000);
        }
      }

      config.showBanner = unityShowBanner;

      function fitCanvasToPortraitViewport() {
        const viewportWidth = Math.max(2, window.innerWidth || document.documentElement.clientWidth);
        const viewportHeight = Math.max(2, window.innerHeight || document.documentElement.clientHeight);
        let width = Math.min(viewportWidth, Math.floor(viewportHeight * 9 / 16));
        let height = Math.floor(width * 16 / 9);

        if (height > viewportHeight) {
          height = viewportHeight;
          width = Math.floor(height * 9 / 16);
        }

        width = Math.max(2, width - (width % 2));
        height = Math.max(2, height - (height % 2));
        canvas.style.width = `${width}px`;
        canvas.style.height = `${height}px`;
      }

      document.addEventListener("gesturestart", event => event.preventDefault(), { passive: false });
      document.addEventListener("touchmove", event => event.preventDefault(), { passive: false });
      window.addEventListener("resize", fitCanvasToPortraitViewport);
      window.addEventListener("orientationchange", () => setTimeout(fitCanvasToPortraitViewport, 100));
      fitCanvasToPortraitViewport();

      const script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, progress => {
          progressBar.style.width = `${Math.round(progress * 100)}%`;
        }).then(() => {
          loading.style.display = "none";
        }).catch(message => {
          unityShowBanner(message, "error");
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
